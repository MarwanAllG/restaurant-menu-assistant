services:
  - type: web
    name: restaurant-menu-assistant-menu-assistant
    runtime: python
    buildCommand: pip install uv==0.11.18 && uv sync --frozen --no-dev
    startCommand: .venv/bin/python -m chainlit run app.py --headless --host 0.0.0.0 --port $PORT
    plan: starter
    numInstances: 1
    healthCheckPath: /health
    disk:
      name: restaurant-menu-assistant-sqlite
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.15
      - key: DEBUG
        value: "false"
      - key: DATA_DIR
        value: /data
      - key: MODEL_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: MODEL_NAME
        value: deepseek/deepseek-v4.1-flash
      - key: OPENROUTER_API_KEY
        sync: false
      - key: TEST_ACCOUNTS_JSON
        sync: false
      - key: CHAINLIT_AUTH_SECRET
        generateValue: true
      - key: CHAINLIT_COOKIE_SAMESITE
        value: none
