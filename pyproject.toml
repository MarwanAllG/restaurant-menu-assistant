[project]
name = "restaurant-menu-assistant"
version = "0.1.0"
description = "Grounded conversational restaurant menu assistant"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "chainlit>=2.9.5,<3",
  "langchain-core>=1.2,<2",
  "langchain-openai>=1.1,<2",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3.0,<4",
  "pydantic>=2.11,<3",
  "python-dotenv>=1.1,<2",
  "httpx>=0.28,<1",
  "openai>=3,<4",
]

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: requires a configured API key and live model access"]

[tool.ruff]
line-length = 100
